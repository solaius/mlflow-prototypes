---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: page-composer
  namespace: page-composer
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.upstream: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"page-composer-upstream"}}'
    serviceaccounts.openshift.io/oauth-redirectreference.downstream: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"page-composer-downstream"}}'

---
# Upstream deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-composer-upstream
  namespace: page-composer
  labels:
    app: page-composer
    variant: upstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: page-composer
      variant: upstream
  template:
    metadata:
      labels:
        app: page-composer
        variant: upstream
    spec:
      serviceAccountName: page-composer
      containers:
        - name: oauth-proxy
          image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=page-composer
            - --upstream=http://localhost:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret=page-composer-upstream-secret
          ports:
            - containerPort: 8443
              name: proxy
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 50m
        - name: composer
          image: quay.io/juntao_wang/page-composer:upstream
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 100m
      volumes:
        - name: tls
          secret:
            secretName: page-composer-upstream-tls
---
apiVersion: v1
kind: Service
metadata:
  name: page-composer-upstream
  namespace: page-composer
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: page-composer-upstream-tls
spec:
  selector:
    app: page-composer
    variant: upstream
  ports:
    - port: 8443
      targetPort: 8443
      name: proxy
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: page-composer-upstream
  namespace: page-composer
spec:
  host: page-composer-upstream.apps.rosa.juntwang-new.z96p.p3.openshiftapps.com
  to:
    kind: Service
    name: page-composer-upstream
  port:
    targetPort: proxy
  tls:
    termination: reencrypt

---
# Downstream deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-composer-downstream
  namespace: page-composer
  labels:
    app: page-composer
    variant: downstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: page-composer
      variant: downstream
  template:
    metadata:
      labels:
        app: page-composer
        variant: downstream
    spec:
      serviceAccountName: page-composer
      containers:
        - name: oauth-proxy
          image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=page-composer
            - --upstream=http://localhost:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret=page-composer-downstream-secret
          ports:
            - containerPort: 8443
              name: proxy
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 50m
        - name: composer
          image: quay.io/juntao_wang/page-composer:downstream
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 100m
      volumes:
        - name: tls
          secret:
            secretName: page-composer-downstream-tls
---
apiVersion: v1
kind: Service
metadata:
  name: page-composer-downstream
  namespace: page-composer
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: page-composer-downstream-tls
spec:
  selector:
    app: page-composer
    variant: downstream
  ports:
    - port: 8443
      targetPort: 8443
      name: proxy
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: page-composer-downstream
  namespace: page-composer
spec:
  host: page-composer-downstream.apps.rosa.juntwang-new.z96p.p3.openshiftapps.com
  to:
    kind: Service
    name: page-composer-downstream
  port:
    targetPort: proxy
  tls:
    termination: reencrypt

# Builds the MLflow frontend statically and publishes it to GitHub Pages.
#
# The asset registry prototypes (Skills, MCP Servers, Agent Plugins, Agents) are
# mock-backed and fully functional here. The rest of MLflow talks to a tracking
# server, which static hosting does not provide, so those pages show empty or
# error states.
name: Deploy prototypes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # The MCP registry calls the real API unless this is set; with no server
      # behind static hosting it serves an in-memory fixture instead.
      REACT_APP_MCP_REGISTRY_MOCKS: 'true'
    steps:
      - uses: actions/checkout@v4

      # Frozen single-registry snapshots, each published under /<branch>/.
      - uses: actions/checkout@v4
        with:
          ref: skills-registry-rfc
          path: _src/skills-registry-rfc

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # MLflow serves index.html at the root and the build under /static-files/,
      # and the webpack publicPath is the relative "static-files/", so each build
      # works from any sub-path unchanged. With no route given, open on Skills.
      - name: Build and assemble site
        run: |
          corepack enable
          build() {
            src="$1"; dest="$2"
            (cd "$src/mlflow/server/js" && yarn install --immutable && yarn build)
            mkdir -p "$dest"
            cp "$src/mlflow/server/js/build/index.html" "$dest/index.html"
            cp "$src/mlflow/server/js/build/favicon.ico" "$dest/" 2>/dev/null || true
            mv "$src/mlflow/server/js/build" "$dest/static-files"
            awk '/<\/body>/ { system("cat /tmp/landing.html") } { print }' "$dest/index.html" > "$dest/index.tmp"
            mv "$dest/index.tmp" "$dest/index.html"
          }
          cat > /tmp/landing.html <<'HTML'
          <script>
            if (window.location.hash === '' || window.location.hash === '#/') {
              window.location.hash = '#/skills';
            }
          </script>
          HTML
          build . _site
          build _src/skills-registry-rfc _site/skills-registry-rfc
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
